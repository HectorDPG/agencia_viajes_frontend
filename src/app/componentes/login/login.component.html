<body>
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-placeholder">
         <img src="assets/images/logo.png" alt="Logo" class="logo">
      </div>
    </div>

    <h1>Login</h1>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          [(ngModel)]="email"
          placeholder="username@gmail.com" 
          required>
        <div class="error-message" style="display: none;">El email es obligatorio y debe ser válido.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          placeholder="Password" 
          [(ngModel)]="password"
          required>
        <div class="error-message" style="display: none;">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      <div class="forgot-password">
        <a href="#forgot">Forgot Password?</a>
      </div>

      <button type="submit" class="boton-login">Sign in</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or continue with</div>
      <div class="divider-line"></div>
    </div>

    <div class="footer-link">
      Aún no tienes una cuenta? <a href="#register">Contacta a soporte</a>
    </div>
  </div>
</body>
